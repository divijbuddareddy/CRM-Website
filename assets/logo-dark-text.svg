<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="navyTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>

  <!-- Hexagon + AI Head Logo Mark -->
  <g transform="translate(8, 5)">
    <!-- Outer Hexagon Frame -->
    <path d="M 40 4 L 75 23 L 75 61 L 40 80 L 5 61 L 5 23 Z" 
          fill="none" 
          stroke="#0A192F" 
          stroke-width="5.5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Head Profile Silhouette (Facing Right) -->
    <path d="M 44 21 
             C 53 21, 60 27, 60 35 
             C 60 39, 58 42, 55 45 
             C 57 48, 59 50, 58 53 
             C 56 53, 53 54, 51 56 
             C 49 58, 48 62, 48 66 
             L 40 66 
             C 40 60, 42 57, 39 55 
             C 37 53, 37 47, 37 45 
             C 34 45, 33 41, 33 38 
             C 33 33, 37 21, 44 21 Z" 
          fill="none" 
          stroke="#0A192F" 
          stroke-width="4" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Circuit Traces & Nodes inside Head -->
    <path d="M 37 31 H 20 L 15 36" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="36" r="3" fill="#0284C7" />

    <path d="M 36 41 H 17 L 22 47" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="47" r="3" fill="#0284C7" />

    <path d="M 38 51 H 26 L 29 57" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="29" cy="57" r="3" fill="#0284C7" />
  </g>

  <!-- Typography Brand Name (Navy Version for Light Backgrounds) -->
  <g transform="translate(96, 12)">
    <text x="0" y="22" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="22" fill="#0A192F" letter-spacing="2.5">AI</text>
    <text x="0" y="44" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#0A192F" letter-spacing="1.5">AUTOMATION</text>
    <text x="0" y="64" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#0A192F" letter-spacing="2">LABS</text>
  </g>
</svg>
